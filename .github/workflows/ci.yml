name: CI

# Fast, offline gates on every PR: pricing consistency, unit tests, and a
# production build. All three checks are required to merge into main (see
# branch protection), complementing the Gitleaks secret scan.
#
# Actions are pinned to commit SHAs with a version comment so Dependabot can
# keep them current (same convention as secret-scan.yml).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pricing:
    name: Pricing check
    runs-on: [self-hosted, linux, x64, vps-verify]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check pricing consistency
        run: npm run check:pricing

  tests:
    name: Unit tests
    runs-on: [self-hosted, linux, x64, vps-verify]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: node --test tests/*.test.mjs

  build:
    name: Build
    runs-on: [self-hosted, linux, x64, vps-verify]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
