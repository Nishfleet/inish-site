name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required check. Project rule (AGENTS.md): run npm test before pushing.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm test

  # Not a required check: the ruleset requires only `test`, so the preview
  # stays visible on every PR but does not gate it (fleet-ops#10935). Cloudflare
  # Workers Previews through the official action; the job summary and the
  # "View deployment" button on the PR carry the link. It skips in the merge
  # queue (no pull request) and for forks and Dependabot, whose runs get no
  # Actions secrets (GitHub docs, "Automating Dependabot with GitHub Actions").
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # A job holding deploy secrets never restores the Actions cache (https://docs.zizmor.sh/audits/#cache-poisoning).
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - id: preview
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: preview --name pr-${{ github.event.pull_request.number }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: The preview link serves the page
        run: test "$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-all-errors --retry-delay 5 "$PREVIEW_URL/daily")" = 200
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}

  dependency-review:
    # GitHub's own check: fails a PR that adds a dependency with a known vulnerability.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # Deploy on merge (fleet-ops#10935 lane: issue, branch, PR, CI, review,
  # queue, deploy on merge). The smoke check is the proof rule: switched on
  # and proven by one real run, or not done.
  deploy:
    needs: [test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://nish.sh/daily
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # A job holding deploy secrets never restores the Actions cache (https://docs.zizmor.sh/audits/#cache-poisoning).
          package-manager-cache: false
      - run: npm ci
      - name: Record the serving Worker version, the rollback target
        run: |
          target=$(npx wrangler deployments status --json | jq -r '[.versions[] | select(.percentage == 100) | .version_id][0]')
          if [ -z "$target" ] || [ "$target" = "null" ]; then
            echo "::error::Could not read the serving Worker version id. Refusing to deploy with no rollback target." >&2
            exit 1
          fi
          echo "ROLLBACK_TARGET=$target" >> "$GITHUB_ENV"
          echo "Rollback target: $target" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - id: deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Live smoke check
        id: smoke
        timeout-minutes: 3
        run: |
          curl -fsS -o /dev/null --retry 10 --retry-all-errors --retry-delay 6 https://nish.sh/daily/latest.json
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' https://inish.in/)" = "301 https://nish.sh/daily"
      - name: Roll back to the serving Worker version
        if: always() && steps.deploy.outcome == 'success' && steps.smoke.outcome != 'success'
        run: npx wrangler rollback "$ROLLBACK_TARGET" --yes --message "smoke failed $GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
