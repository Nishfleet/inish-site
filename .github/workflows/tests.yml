name: Tests

# Thin caller for the canonical reusable PR-checks workflow.
# The standard (timeout-minutes, concurrency+cancel, batched CI + gitleaks,
# docs-only fast path, 7-day SARIF retention) lives in nish3451/shared-workflows
# and is applied here by construction. Updates on the `v1` branch propagate
# automatically. Do not override the called workflow's steps — pass inputs
# instead.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    # Job name kept stable as `test` per the repo's existing convention.
    name: test
    uses: nish3451/shared-workflows/.github/workflows/pr-checks.yml@v1
    with:
      # No package-lock.json in this repo: skip npm install AND npm cache.
      install-command: ""
      # Python unittest (stdlib) + Node node:test — both dependency-free.
      verify-command: python3 -m unittest discover -s tests -v && node --test "tests/**/*.test.mjs"
      python-version: "3.12"
    secrets: inherit
