# The test gate for pull requests.
#
# main became protected on 2026-08-08 requiring only `classify` - the review-gate
# labeller, which passes regardless of whether the code works. With Phase 3
# auto-merge armed, that let a green-looking PR land untested. This workflow adds
# the real gate: the repository's own test suites - the Python unittest suite
# AND the Node test suite (tests/test_middleware_deny.test.mjs proves the
# middleware deny branch behaviorally; omitting it keeps CI green when the deny
# branch is disabled). Keep the job name `test` stable; branch protection
# requires it by exact name.
name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: [self-hosted, linux, x64, vps-verify]
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: '3.12'

      - name: Run the Python unit tests
        # No third-party dependencies: the suite is stdlib unittest only.
        run: python3 -m unittest discover -s tests -v

      - name: Run the Node tests
        # No third-party dependencies: node:test and node:assert only.
        # Discovery-based, like the Python side: every committed *.test.mjs
        # under tests/ runs, so a future regression cannot sit outside CI.
        # (Node runs the glob itself; the directory form would be treated as
        # a module entry point.)
        run: node --test "tests/**/*.test.mjs"
