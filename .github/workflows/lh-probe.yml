name: LH probe
on:
  pull_request:
    paths: [".github/workflows/lh-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Gather
        run: |
          for i in 1 2 3; do
            npx --yes lighthouse@12.6.1 https://nish.sh/daily --chrome-flags="--headless=new --no-sandbox" --only-categories=performance -G -A=./art$i --output=json --output-path=./out$i.json --quiet || true
          done
          ls -la
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: probe
          path: |
            art*/
            out*.json
