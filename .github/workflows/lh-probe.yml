name: LH probe
on:
  pull_request:
    paths: [".github/workflows/lh-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch the config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Nishfleet/fleet-ops
          ref: main
          path: fleet-ops
          sparse-checkout: config/lighthouserc.json
          persist-credentials: false
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        continue-on-error: true
        with:
          urls: https://nish.sh/daily
          runs: 5
          configPath: ./fleet-ops/config/lighthouserc.json
          uploadArtifacts: false
          temporaryPublicStorage: false
      - name: Dump
        run: |
          python3 - <<'PY'
          import json,glob
          for f in sorted(glob.glob('.lighthouseci/lhr-*.json')):
              d=json.load(open(f)); a=d['audits']
              m=a['metrics']['details']['items'][0]
              print(f, 'LH',d['lighthouseVersion'],'LCP',round(a['largest-contentful-paint']['numericValue']),'FCP',round(a['first-contentful-paint']['numericValue']),'TTFB',m.get('timeToFirstByte'),'obsLCP',m.get('observedLargestContentfulPaint'),'obsFCP',m.get('observedFirstContentfulPaint'),'srv',round(a['server-response-time']['numericValue']),'bench',d['environment'].get('benchmarkIndex'), d['environment'].get('hostUserAgent'))
              for it in a['network-requests']['details']['items']:
                  print('   ',it['url'][-45:],it['protocol'],it['transferSize'],round(it['networkRequestTime']),round(it['networkEndTime']),it.get('priority'))
          PY
